---

# Loki version to download from GitHub releases
loki_version: "3.5.0"

# Unix user and group for Loki
loki_user: "loki"
loki_group: "loki"

# Filesystem paths
loki_install_dir: "/usr/local/bin"
loki_config_dir: "/etc/loki"
loki_data_dir: "/var/lib/loki"

# HTTP listener
loki_listen_address: "{{ ip_address }}"
loki_port: 3100

# Retention period
loki_retention_period: "744h"
