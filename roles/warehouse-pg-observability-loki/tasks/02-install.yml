---

- name: Create loki group
  ansible.builtin.group:
    name: "{{ loki_group }}"
    system: true
    state: present

- name: Create loki user
  ansible.builtin.user:
    name: "{{ loki_user }}"
    group: "{{ loki_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create Loki directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ loki_user }}"
    group: "{{ loki_group }}"
    mode: "0755"
  loop:
    - "{{ loki_config_dir }}"
    - "{{ loki_data_dir }}"

- name: Check if Loki binary exists with correct version
  ansible.builtin.command:
    cmd: "{{ loki_install_dir }}/loki --version"
  register: _loki_installed_version
  changed_when: false
  failed_when: false

- name: Download and install Loki binary
  when: >
    _loki_installed_version.rc != 0 or
    loki_version not in _loki_installed_version.stdout
  block:
    - name: Create secure temp directory
      ansible.builtin.tempfile:
        state: directory
        suffix: "_loki"
      register: _loki_tmp_dir

    - name: Fetch Loki SHA256 checksums
      ansible.builtin.uri:
        url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/SHA256SUMS"
        return_content: true
      register: _loki_checksums

    - name: Parse SHA256 checksum for Loki archive
      ansible.builtin.set_fact:
        _loki_checksum: >-
          {{ (_loki_checksums.content.splitlines()
              | select('search', 'loki-linux-amd64.zip')
              | first).split()[0] }}

    - name: Download Loki archive
      ansible.builtin.get_url:
        url: "https://github.com/grafana/loki/releases/download/v{{ loki_version }}/loki-linux-amd64.zip"
        dest: "{{ _loki_tmp_dir.path }}/loki.zip"
        checksum: "sha256:{{ _loki_checksum }}"
        mode: "0600"

    - name: Extract Loki binary
      ansible.builtin.unarchive:
        src: "{{ _loki_tmp_dir.path }}/loki.zip"
        dest: "{{ _loki_tmp_dir.path }}"
        remote_src: true

    - name: Install Loki binary
      ansible.builtin.copy:
        src: "{{ _loki_tmp_dir.path }}/loki-linux-amd64"
        dest: "{{ loki_install_dir }}/loki"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart loki

  always:
    - name: Remove secure temp directory
      ansible.builtin.file:
        path: "{{ _loki_tmp_dir.path }}"
        state: absent
      when: _loki_tmp_dir.path is defined
