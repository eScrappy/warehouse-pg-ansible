---

# Temporal.io server role defaults
#
# Installs the Temporal.io workflow service, which WEM uses for background
# job scheduling and durable workflow execution.
#
# Temporal requires a PostgreSQL persistence backend. By default this role
# assumes the postgresql role (also in the wem_stack play) has already
# created a local PostgreSQL instance on the same host.

# wait no longer than this time in seconds for downloads
DNF_TIMEOUT: 120

# Temporal server version to install (from GitHub releases)
temporal_version: "1.31.1"

# Schema versions shipped with temporal_version above.
# Update these when upgrading temporal_version.
temporal_main_schema_version: "1.19"
temporal_visibility_schema_version: "1.14"
temporal_db_plugin: "postgres12"

# Architecture suffix used in the GitHub release tarball name
temporal_arch: "amd64"

# Download URL for the Temporal server tarball
temporal_download_url: >-
  https://github.com/temporalio/temporal/releases/download/v{{ temporal_version }}/temporal_{{ temporal_version }}_linux_{{ temporal_arch }}.tar.gz

# Temporal CLI version and download URL
temporal_cli_version: "1.7.2"
temporal_cli_download_url: >-
  https://github.com/temporalio/cli/releases/download/v{{ temporal_cli_version }}/temporal_cli_{{ temporal_cli_version }}_linux_{{ temporal_arch }}.tar.gz

# -----------------------------------------------------------------------------
# Filesystem paths
# -----------------------------------------------------------------------------
temporal_install_dir: "/usr/local/temporal"
temporal_bin_dir: "/usr/bin"
temporal_config_dir: "/etc/temporal"
temporal_log_dir: "/var/log/temporal"
temporal_data_dir: "/var/lib/temporal"

# Environment name — Temporal server looks for <temporal_config_dir>/<env>.yaml
temporal_config_env: "temporal-server"

# -----------------------------------------------------------------------------
# Unix identity
# -----------------------------------------------------------------------------
temporal_user: "temporal"
temporal_group: "temporal"

# -----------------------------------------------------------------------------
# Systemd service
# -----------------------------------------------------------------------------
temporal_service_name: "temporal"
temporal_service_enabled: true
temporal_service_started: true

# -----------------------------------------------------------------------------
# Network ports
# -----------------------------------------------------------------------------
temporal_bind_ip: "{{ ip_address }}"
temporal_frontend_grpc_port: 7233
temporal_frontend_membership_port: 6933
temporal_history_grpc_port: 7234
temporal_history_membership_port: 6934
temporal_matching_grpc_port: 7235
temporal_matching_membership_port: 6935
temporal_worker_grpc_port: 7239
temporal_worker_membership_port: 6939
temporal_pprof_port: 7936

# -----------------------------------------------------------------------------
# Persistence: PostgreSQL backend
# -----------------------------------------------------------------------------
# Defaults to the local PostgreSQL instance installed by the postgresql role.
# NOTE: Remote PostgreSQL is not supported — the role writes pg_hba.conf
# directly to the local filesystem via pg_data_dir. If PostgreSQL runs on
# a different host, manage pg_hba.conf on that host separately and set
# temporal_manage_db: false.
# PostgreSQL data directory — must match pg_data_dir in the postgresql role
pg_data_dir: "/var/lib/pgsql/data"

temporal_db_host: "127.0.0.1"
temporal_db_port: 5433
temporal_db_name: "temporal"
temporal_visibility_db_name: "temporal_visibility"
temporal_db_user: "temporal"
# Leave empty to connect without a password (e.g. trust auth in pg_hba.conf).
temporal_db_password: ""

# Number of history shards — must be a power of 2.
# Use 4 or 8 for small / single-node deployments; 512+ for large production.
temporal_num_history_shards: 4

# -----------------------------------------------------------------------------
# Database bootstrap
# -----------------------------------------------------------------------------
# When true the role creates the PostgreSQL user and databases and applies the
# Temporal schema. Set to false if you manage the databases externally.
temporal_manage_db: true

# -----------------------------------------------------------------------------
# Default namespace
# -----------------------------------------------------------------------------
# The default namespace is created automatically by the server on first start
# (SKIP_DEFAULT_NAMESPACE_CREATION=false in the systemd unit).
temporal_default_namespace: "default"
temporal_default_namespace_retention: "72h"
