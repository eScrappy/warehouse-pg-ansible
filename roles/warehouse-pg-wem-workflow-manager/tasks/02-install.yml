---

- name: Install Temporal
  block:
    - name: Create temporal system group
      ansible.builtin.group:
        name: "{{ temporal_group }}"
        system: true
        state: present

    - name: Create temporal system user
      ansible.builtin.user:
        name: "{{ temporal_user }}"
        group: "{{ temporal_group }}"
        system: true
        shell: /sbin/nologin
        home: "{{ temporal_data_dir }}"
        create_home: false
        state: present

    - name: Create Temporal runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ temporal_user }}"
        group: "{{ temporal_group }}"
        mode: "0750"
      loop:
        - "{{ temporal_install_dir }}"
        - "{{ temporal_config_dir }}"
        - "{{ temporal_log_dir }}"
        - "{{ temporal_data_dir }}"

    - name: Read installed Temporal version from binary
      ansible.builtin.shell:
        cmd: "{{ temporal_bin_dir }}/temporal-server --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' | head -1"
        executable: /bin/bash
      register: _temporal_installed_version
      changed_when: false
      failed_when: false

    - name: Determine whether a (re)install is needed
      ansible.builtin.set_fact:
        _temporal_needs_install: >-
          {{
            (_temporal_installed_version.rc != 0)
            or (_temporal_installed_version.stdout | trim != temporal_version)
          }}

    - name: Download and install Temporal server
      when: _temporal_needs_install | bool
      block:
        - name: Create secure temp directory for Temporal server
          ansible.builtin.tempfile:
            state: directory
            suffix: "_temporal"
          register: _temporal_tmp_dir

        - name: Download Temporal server archive
          ansible.builtin.get_url:
            url: "{{ temporal_download_url }}"
            dest: "{{ _temporal_tmp_dir.path }}/temporal.tar.gz"
            mode: "0600"

        - name: Extract Temporal server archive
          ansible.builtin.unarchive:
            src: "{{ _temporal_tmp_dir.path }}/temporal.tar.gz"
            dest: "{{ _temporal_tmp_dir.path }}"
            remote_src: true

        - name: Copy Temporal server binaries to install directory
          ansible.builtin.copy:
            src: "{{ _temporal_tmp_dir.path }}/{{ item }}"
            dest: "{{ temporal_install_dir }}/{{ item }}"
            owner: "{{ temporal_user }}"
            group: "{{ temporal_group }}"
            mode: "0755"
            remote_src: true
          loop:
            - temporal-server
            - temporal-sql-tool
          notify: Restart temporal

        - name: Copy temporal-server binary to PATH
          ansible.builtin.copy:
            src: "{{ temporal_install_dir }}/temporal-server"
            dest: "{{ temporal_bin_dir }}/temporal-server"
            owner: root
            group: root
            mode: "0755"
            remote_src: true

      always:
        - name: Remove secure temp directory for Temporal server
          ansible.builtin.file:
            path: "{{ _temporal_tmp_dir.path }}"
            state: absent
          when: _temporal_tmp_dir.path is defined

    - name: Check installed Temporal CLI version
      ansible.builtin.shell:
        cmd: "temporal --version 2>&1 | grep -oP '\\d+\\.\\d+\\.\\d+' | head -1"
        executable: /bin/bash
      register: _temporal_cli_installed_version
      changed_when: false
      failed_when: false

    - name: Download and install Temporal CLI
      when: >
        (_temporal_cli_installed_version.rc != 0) or
        (_temporal_cli_installed_version.stdout | trim != temporal_cli_version)
      block:
        - name: Create secure temp directory for Temporal CLI
          ansible.builtin.tempfile:
            state: directory
            suffix: "_temporal_cli"
          register: _temporal_cli_tmp_dir

        - name: Download Temporal CLI archive
          ansible.builtin.get_url:
            url: "{{ temporal_cli_download_url }}"
            dest: "{{ _temporal_cli_tmp_dir.path }}/temporal_cli.tar.gz"
            mode: "0600"

        - name: Extract Temporal CLI archive
          ansible.builtin.unarchive:
            src: "{{ _temporal_cli_tmp_dir.path }}/temporal_cli.tar.gz"
            dest: "{{ _temporal_cli_tmp_dir.path }}"
            remote_src: true

        - name: Install Temporal CLI binary
          ansible.builtin.copy:
            src: "{{ _temporal_cli_tmp_dir.path }}/temporal"
            dest: "{{ temporal_bin_dir }}/temporal"
            owner: root
            group: root
            mode: "0755"
            remote_src: true

      always:
        - name: Remove secure temp directory for Temporal CLI
          ansible.builtin.file:
            path: "{{ _temporal_cli_tmp_dir.path }}"
            state: absent
          when: _temporal_cli_tmp_dir.path is defined
