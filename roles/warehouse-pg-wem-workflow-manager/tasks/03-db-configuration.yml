---

# Applies the Temporal schema using temporal-sql-tool with embedded schemas.
# DB user and databases are created by warehouse-pg-wem-state-database/tasks/databases.yml.
# Only runs when temporal_manage_db is true (the default).

# Build --password <value> arg only when a password is set.
# When temporal_db_password is empty (trust auth), omitting the flag avoids
# shell argument-parsing bugs where the next flag name becomes the value.
- name: Build Temporal DB CLI password argument
  ansible.builtin.set_fact:
    _temporal_db_pw_arg: >-
      {{ ('--password ' + temporal_db_password) if temporal_db_password | default('') | length > 0 else '' }}
  no_log: true

- name: Check current Temporal main schema version
  ansible.builtin.shell:
    cmd: |
      psql \
        -h {{ temporal_db_host }} -p {{ temporal_db_port }} \
        -U {{ temporal_db_user }} -d {{ temporal_db_name }} \
        -tc "SELECT curr_version FROM schema_version;" 2>/dev/null || echo "missing"
    executable: /bin/bash
  environment:
    PGPASSWORD: "{{ temporal_db_password }}"
  no_log: true
  register: _temporal_main_schema_version
  changed_when: false
  failed_when: false

- name: Setup Temporal main schema versioning
  ansible.builtin.shell:
    cmd: |
      {{ temporal_install_dir }}/temporal-sql-tool \
        --endpoint {{ temporal_db_host }} \
        --port {{ temporal_db_port }} \
        --user {{ temporal_db_user }} \
        {{ _temporal_db_pw_arg }} \
        --database {{ temporal_db_name }} \
        --plugin {{ temporal_db_plugin }} \
        setup-schema -v 0.0
    executable: /bin/bash
  environment:
    PGPASSWORD: "{{ temporal_db_password }}"
  no_log: true
  when: "'missing' in (_temporal_main_schema_version.stdout | trim)"

- name: Update Temporal main schema to latest version
  ansible.builtin.shell:
    cmd: |
      {{ temporal_install_dir }}/temporal-sql-tool \
        --endpoint {{ temporal_db_host }} \
        --port {{ temporal_db_port }} \
        --user {{ temporal_db_user }} \
        {{ _temporal_db_pw_arg }} \
        --database {{ temporal_db_name }} \
        --plugin {{ temporal_db_plugin }} \
        update-schema --schema-name postgresql/v12/temporal
    executable: /bin/bash
  environment:
    PGPASSWORD: "{{ temporal_db_password }}"
  no_log: true
  when: (_temporal_main_schema_version.stdout | trim) != temporal_main_schema_version

- name: Check current Temporal visibility schema version
  ansible.builtin.shell:
    cmd: |
      psql \
        -h {{ temporal_db_host }} -p {{ temporal_db_port }} \
        -U {{ temporal_db_user }} -d {{ temporal_visibility_db_name }} \
        -tc "SELECT curr_version FROM schema_version;" 2>/dev/null || echo "missing"
    executable: /bin/bash
  environment:
    PGPASSWORD: "{{ temporal_db_password }}"
  no_log: true
  register: _temporal_visibility_schema_version
  changed_when: false
  failed_when: false

- name: Setup Temporal visibility schema versioning
  ansible.builtin.shell:
    cmd: |
      {{ temporal_install_dir }}/temporal-sql-tool \
        --endpoint {{ temporal_db_host }} \
        --port {{ temporal_db_port }} \
        --user {{ temporal_db_user }} \
        {{ _temporal_db_pw_arg }} \
        --database {{ temporal_visibility_db_name }} \
        --plugin {{ temporal_db_plugin }} \
        setup-schema -v 0.0
    executable: /bin/bash
  environment:
    PGPASSWORD: "{{ temporal_db_password }}"
  no_log: true
  when: "'missing' in (_temporal_visibility_schema_version.stdout | trim)"

- name: Update Temporal visibility schema to latest version
  ansible.builtin.shell:
    cmd: |
      {{ temporal_install_dir }}/temporal-sql-tool \
        --endpoint {{ temporal_db_host }} \
        --port {{ temporal_db_port }} \
        --user {{ temporal_db_user }} \
        {{ _temporal_db_pw_arg }} \
        --database {{ temporal_visibility_db_name }} \
        --plugin {{ temporal_db_plugin }} \
        update-schema --schema-name postgresql/v12/visibility
    executable: /bin/bash
  environment:
    PGPASSWORD: "{{ temporal_db_password }}"
  no_log: true
  when: (_temporal_visibility_schema_version.stdout | trim) != temporal_visibility_schema_version
