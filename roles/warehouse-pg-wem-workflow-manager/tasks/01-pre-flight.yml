---

- name: Check for Red Hat based OS
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == "RedHat"
    fail_msg: "This role only supports Red Hat based operating systems."

- name: Check that role runs as root
  ansible.builtin.assert:
    that:
      - ansible_facts["user_uid"] == 0
    fail_msg: "This role requires become: true — tasks must run as root."

- name: Assert installation variables are valid
  block:
    - name: Assert temporal_num_history_shards is a power of 2
      ansible.builtin.assert:
        that:
          - temporal_num_history_shards | int > 0
          - (temporal_num_history_shards | int) | log(2) == (temporal_num_history_shards | int) | log(2) | int
        fail_msg: >-
          temporal_num_history_shards must be a positive power of 2
          (e.g. 1, 2, 4, 8, 16, 32, 64, 128, 256, 512).
          Got: {{ temporal_num_history_shards }}.

- name: Assert PostgreSQL connectivity for Temporal databases
  when: temporal_manage_db | bool
  block:
    - name: Check database connectivity as {{ temporal_db_user }} user to database {{ temporal_db_name }}
      ansible.builtin.shell:
        cmd: >-
          psql
          -h {{ temporal_db_host }}
          -p {{ temporal_db_port }}
          -U {{ temporal_db_user }}
          -d postgres
          -c "SELECT 1" -q --no-align --tuples-only
        executable: /bin/bash
      environment:
        PGPASSWORD: "{{ temporal_db_password }}"
      become: true
      become_user: postgres
      register: _temporal_pg_check
      changed_when: false
      failed_when: false
      no_log: true

    - name: Fail if PostgreSQL is not reachable
      ansible.builtin.assert:
        that: _temporal_pg_check.rc == 0
        fail_msg: >-
          Cannot connect to PostgreSQL at port {{ temporal_db_port }}.
          Ensure warehouse-pg-wem-state-database role has run and the service is up.
          psql error: {{ _temporal_pg_check.stderr | default('(no output)') }}
