---

- name: Check for Red Hat based OS
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == "RedHat"
    fail_msg: "This role only supports Red Hat based operating systems."

- name: Run pre-flight checks
  ansible.builtin.import_tasks: 01-pre-flight.yml

- name: Install Temporal.io server
  ansible.builtin.import_tasks: 02-install.yml

- name: Bootstrap Temporal PostgreSQL databases and schema
  ansible.builtin.import_tasks: 03-db-configuration.yml
  when: temporal_manage_db | bool

- name: Configure Temporal.io server
  ansible.builtin.import_tasks: 04-configure.yml

- name: Manage Temporal.io service
  ansible.builtin.import_tasks: 05-service.yml
