---

- name: Enable and start the Temporal service
  ansible.builtin.systemd:
    name: "{{ temporal_service_name }}"
    enabled: "{{ temporal_service_enabled | bool }}"
    state: "{{ 'started' if (temporal_service_started | bool) else 'stopped' }}"
    daemon_reload: true
  become: true
  become_user: root

- name: Wait for Temporal frontend gRPC port to be reachable
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if temporal_bind_ip == '0.0.0.0' else temporal_bind_ip }}"
    port: "{{ temporal_frontend_grpc_port }}"
    timeout: 60
  when: temporal_service_started | bool


- name: Create wem Temporal namespace
  ansible.builtin.shell:
    cmd: >-
      temporal operator namespace describe -n wem
      --address {{ ip_address }}:{{ temporal_frontend_grpc_port }} 2>/dev/null
      || temporal operator namespace create -n wem
      --address {{ ip_address }}:{{ temporal_frontend_grpc_port }}
      --retention {{ temporal_default_namespace_retention }}
    executable: /bin/bash
  changed_when: false
  failed_when: false
  when: temporal_service_started | bool
