---

- name: Deploy Temporal server configuration from template
  ansible.builtin.template:
    src: temporal-server.yaml.j2
    dest: "{{ temporal_config_dir }}/{{ temporal_config_env }}.yaml"
    owner: "{{ temporal_user }}"
    group: "{{ temporal_group }}"
    mode: "0640"
  become: true
  no_log: true
  notify: Restart temporal

- name: Deploy Temporal systemd unit file
  ansible.builtin.template:
    src: temporal.service.j2
    dest: /etc/systemd/system/temporal.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart temporal
