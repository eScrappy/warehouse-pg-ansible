---

- name: Map collector_upgrade to dnf state
  ansible.builtin.set_fact:
    _obs_collector_dnf_state: >-
      {{ 'latest' if collector_upgrade == 'always-upgrade-to-latest-minor'
         else ('absent' if collector_upgrade == 'absent' else 'present') }}

- name: Install edb-whpg-observability-collector package
  ansible.builtin.dnf:
    name: "{{ obs_collector_package_name }}{{ '-' ~ obs_collector_version if obs_collector_version else '' }}"
    state: "{{ _obs_collector_dnf_state }}"
  become: true
  become_user: root
  timeout: "{{ DNF_TIMEOUT }}"
  throttle: "{{ serial_operations }}"
  register: _obs_collector_install
  until: _obs_collector_install is succeeded
  retries: 10
  delay: 5

- name: Grant gpadmin passwordless sudo
  ansible.builtin.copy:
    content: "{{ WHPG_UNIX_USER }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ WHPG_UNIX_USER }}"
    mode: "0440"
  become: true
  become_user: root

