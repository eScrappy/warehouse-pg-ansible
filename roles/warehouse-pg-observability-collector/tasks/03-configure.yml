---

- name: Set collector configuration values in collector.conf
  ansible.builtin.lineinfile:
    path: "{{ obs_collector_config_file }}"
    regexp: "^#?\\s*{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: "WHPG_OBS_DSN",          value: '"host={{ obs_collector_whpg_host }}{% if obs_collector_whpg_port | string | length > 0 %} port={{ obs_collector_whpg_port }}{% endif %} dbname={{ obs_collector_whpg_dbname }}{% if obs_collector_whpg_user | length > 0 %} user={{ obs_collector_whpg_user }}{% endif %}{% if obs_collector_whpg_password | length > 0 %} password={{ obs_collector_whpg_password }}{% endif %} sslmode={{ obs_collector_whpg_sslmode }}"' }
    - { key: "LOKI_ENDPOINT",         value: '"{{ obs_collector_loki_endpoint }}"' }
    - { key: "PROMETHEUS_ENDPOINT",   value: '"{{ obs_collector_prometheus_endpoint }}"' }
  become: true
  notify: Restart whpg-observability-collector
  no_log: true

- name: Run deploy-observability script
  ansible.builtin.command:
    cmd: ./deploy-observability
    chdir: /var/lib/whpg-observability-collector
  become: true
  become_user: "{{ WHPG_UNIX_USER }}"

- name: Enable and start Alloy service
  ansible.builtin.systemd:
    name: alloy
    enabled: true
    state: started
    daemon_reload: true
  become: true
  become_user: root
