---

- name: Check for Red Hat based OS
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == "RedHat"
    fail_msg: "This role only supports Red Hat based operating systems."

- name: Assert collector_upgrade is a valid value
  ansible.builtin.assert:
    that:
      - collector_upgrade is defined
      - collector_upgrade is string
      - collector_upgrade in ['install-but-no-automatic-upgrades', 'always-upgrade-to-latest-minor', 'absent']
    fail_msg: >-
      collector_upgrade must be 'install-but-no-automatic-upgrades',
      'always-upgrade-to-latest-minor', or 'absent'
      (got '{{ collector_upgrade | default('undefined') }}').

- name: Assert Loki endpoint is set
  ansible.builtin.assert:
    that:
      - obs_collector_loki_endpoint | length > 0
    fail_msg: >-
      obs_collector_loki_endpoint is empty. Set loki_endpoint in group_vars
      or pass -e obs_collector_loki_endpoint=http://<host>:3100/loki/api/v1/push.
  when: collector_upgrade != 'absent'

- name: Assert Prometheus endpoint is set
  ansible.builtin.assert:
    that:
      - obs_collector_prometheus_endpoint | length > 0
    fail_msg: >-
      obs_collector_prometheus_endpoint is empty. Set prometheus_endpoint in group_vars
      or pass -e obs_collector_prometheus_endpoint=http://<host>:9090/api/v1/write.
  when: collector_upgrade != 'absent'
