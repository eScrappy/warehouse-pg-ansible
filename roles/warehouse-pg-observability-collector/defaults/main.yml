---

WHPG_UNIX_USER: "gpadmin"

# Package name from EDB repository
obs_collector_package_name: "edb-whpg-observability-collector"
# Pin a specific RPM version (e.g. "1.2.3"). Leave empty to install whatever
# version the configured EDB repository provides.
obs_collector_version: ""
# Accepted values:
#   "install-but-no-automatic-upgrades" — install if missing, never auto-upgrade (default)
#   "always-upgrade-to-latest-minor"    — upgrade to latest on every run
#   "absent"                            — remove the package
collector_upgrade: "install-but-no-automatic-upgrades"

DNF_TIMEOUT: 120
# Throttle concurrent installs to avoid hitting EDB repository retry limits
serial_operations: 1

# Config file path (coordinator only)
obs_collector_config_file: "/var/lib/whpg-observability-collector/collector.conf"

# Loki and Prometheus endpoint to push logs and metrics.
loki_host: "localhost"
loki_port: 3100
prometheus_host: "localhost"
prometheus_port: 9090

loki_endpoint: "http://{{ loki_host }}:{{ loki_port }}/loki/api/v1/push"
prometheus_endpoint: "http://{{ prometheus_host }}:{{ prometheus_port }}/api/v1/write"

# Loki endpoint
obs_collector_loki_endpoint: "{{ loki_endpoint }}"

# Prometheus endpoint
obs_collector_prometheus_endpoint: "{{ prometheus_endpoint }}"

# WarehousePG DSN for the collector (coordinator only)
# Format: "host=<host> port=5432 dbname=postgres user=gpadmin password= sslmode=disable"
obs_collector_whpg_host: "127.0.0.1"
obs_collector_whpg_port: "{{ whpg_port | default('') }}"
obs_collector_whpg_dbname: "{{ whpg_dbname | default('postgres') }}"
obs_collector_whpg_user: "{{ whpg_user | default('') }}"
obs_collector_whpg_password: "{{ whpg_password | default('') }}"
obs_collector_whpg_sslmode: "disable"
