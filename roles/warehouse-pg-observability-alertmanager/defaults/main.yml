---

# Alertmanager version to download from GitHub releases
alertmanager_version: "0.33.0"

# Unix user and group for Alertmanager
alertmanager_user: "alertmanager"
alertmanager_group: "alertmanager"

# Filesystem paths
alertmanager_install_dir: "/usr/local/bin"
alertmanager_config_dir: "/etc/alertmanager"
alertmanager_data_dir: "/var/lib/alertmanager"

# Web listener
alertmanager_listen_address: "{{ ip_address }}"
alertmanager_port: 9093

# How long to wait before declaring an alert resolved if no new alerts arrive
alertmanager_resolve_timeout: "5m"

# Global integrations — leave empty to disable
# alertmanager_slack_api_url: "https://hooks.slack.com/services/T00000000/B00000000/XXXXXXXX"
# alertmanager_pagerduty_url: "https://events.pagerduty.com/v2/enqueue"
alertmanager_slack_api_url: ""
alertmanager_pagerduty_url: ""

# Default routing
alertmanager_route_group_by:
  - alertname
  - cluster
  - service
alertmanager_route_group_wait: "30s"
alertmanager_route_group_interval: "5m"
alertmanager_route_repeat_interval: "4h"
alertmanager_route_receiver: "null-receiver"

# Child routes — list of route objects (empty by default, all alerts go to default receiver)
# Each entry supports: match, match_re, receiver, continue, group_by, group_wait,
# group_interval, repeat_interval
# Example:
#   alertmanager_routes:
#     - match_re:
#         environment: 'dev|qa|staging'
#       receiver: 'null-receiver'
#     - match:
#         severity: 'critical'
#       receiver: 'pagerduty-high-priority'
#       continue: true
#     - match:
#         service: 'database'
#       receiver: 'slack-db-team'
alertmanager_routes: []

# Receivers — list of receiver objects
# At minimum keep the null-receiver so the default route always resolves.
# Example:
#   alertmanager_receivers:
#     - name: 'slack-default'
#       slack_configs:
#         - channel: '#ops-alerts'
#           send_resolved: true
#           icon_emoji: ':bell:'
#           title: '{{ .CommonAnnotations.summary }}'
#           text:  '{{ .CommonAnnotations.description }}'
#     - name: 'pagerduty-high-priority'
#       pagerduty_configs:
#         - routing_key: 'YOUR_PAGERDUTY_SERVICE_INTEGRATION_KEY'
#           send_resolved: true
#           severity: '{{ .CommonLabels.severity }}'
#     - name: 'null-receiver'
alertmanager_receivers:
  - name: "null-receiver"

# Inhibition rules — mute a set of alerts when another set is already firing
# Example:
#   alertmanager_inhibit_rules:
#     - source_match:
#         alertname: 'NodeNetworkDown'
#       target_match:
#         severity: 'critical'
#       equal:
#         - node
#         - instance
alertmanager_inhibit_rules: []
