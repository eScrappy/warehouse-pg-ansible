---

- name: Create alertmanager group
  ansible.builtin.group:
    name: "{{ alertmanager_group }}"
    system: true
    state: present

- name: Create alertmanager user
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create Alertmanager directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_group }}"
    mode: "0755"
  loop:
    - "{{ alertmanager_config_dir }}"
    - "{{ alertmanager_data_dir }}"

- name: Check if Alertmanager binary exists with correct version
  ansible.builtin.command:
    cmd: "{{ alertmanager_install_dir }}/alertmanager --version"
  register: _alertmanager_installed_version
  changed_when: false
  failed_when: false

- name: Download and install Alertmanager binary
  when: >
    _alertmanager_installed_version.rc != 0 or
    alertmanager_version not in _alertmanager_installed_version.stdout
  block:
    - name: Create secure temp directory
      ansible.builtin.tempfile:
        state: directory
        suffix: "_alertmanager"
      register: _alertmanager_tmp_dir

    - name: Fetch Alertmanager SHA256 checksums
      ansible.builtin.uri:
        url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/sha256sums.txt"
        return_content: true
      register: _alertmanager_checksums

    - name: Parse SHA256 checksum for alertmanager archive
      ansible.builtin.set_fact:
        _alertmanager_checksum: >-
          {{ (_alertmanager_checksums.content.splitlines()
              | select('search', 'alertmanager-' ~ alertmanager_version ~ '.linux-amd64.tar.gz')
              | first).split()[0] }}

    - name: Download Alertmanager archive
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
        dest: "{{ _alertmanager_tmp_dir.path }}/alertmanager.tar.gz"
        checksum: "sha256:{{ _alertmanager_checksum }}"
        mode: "0600"

    - name: Extract Alertmanager archive
      ansible.builtin.unarchive:
        src: "{{ _alertmanager_tmp_dir.path }}/alertmanager.tar.gz"
        dest: "{{ _alertmanager_tmp_dir.path }}"
        remote_src: true

    - name: Install Alertmanager binaries
      ansible.builtin.copy:
        src: "{{ _alertmanager_tmp_dir.path }}/alertmanager-{{ alertmanager_version }}.linux-amd64/{{ item }}"
        dest: "{{ alertmanager_install_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      loop:
        - alertmanager
        - amtool
      notify: Restart alertmanager

  always:
    - name: Remove secure temp directory
      ansible.builtin.file:
        path: "{{ _alertmanager_tmp_dir.path }}"
        state: absent
      when: _alertmanager_tmp_dir.path is defined
