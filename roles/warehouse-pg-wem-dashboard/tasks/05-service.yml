---

- name: Enable and start the wem service (with diagnostic logs on failure)
  become: true
  become_user: root
  block:
    - name: Enable and start the wem service
      ansible.builtin.systemd:
        name: "{{ wem_service_name }}"
        enabled: "{{ wem_service_enabled | bool }}"
        state: "{{ 'started' if (wem_service_started | bool) else 'stopped' }}"
        daemon_reload: true

  rescue:
    - name: Collect WEM service status
      ansible.builtin.command:
        cmd: "systemctl status {{ wem_service_name }} --no-pager -l"
      register: wem_status
      changed_when: false
      failed_when: false

    - name: Collect WEM journal logs
      ansible.builtin.command:
        cmd: "journalctl -xeu {{ wem_service_name }} -n 100 --no-pager"
      register: wem_journal
      changed_when: false
      failed_when: false

    - name: Print WEM service status
      ansible.builtin.debug:
        msg: "{{ wem_status.stdout_lines }}"

    - name: Print WEM journal logs
      ansible.builtin.debug:
        msg: "{{ wem_journal.stdout_lines }}"

    - name: Fail with diagnostic hint
      ansible.builtin.fail:
        msg: >-
          WEM service failed to start. Check the status and logs printed above.
          Common causes: misconfigured wem.conf, database not reachable,
          or port {{ wem_port }} already in use.
