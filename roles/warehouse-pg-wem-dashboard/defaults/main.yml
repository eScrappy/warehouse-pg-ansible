---

# WarehousePG Enterprise Manager (WEM) role defaults
#
# Reference: https://www.enterprisedb.com/docs/supported-open-source/warehousepg/wem/installing/wem/
#
# This role assumes that the EDB repository providing the
# "whpg-enterprise-manager" RPM is already configured on the target host.
# if that is not the case, and you want the repository installed,
# configure the "edb-repository" role for this host.

# wait no longer than this time in seconds for the RPM repository
DNF_TIMEOUT: 120

# RPM package name and desired state
wem_package_name: "whpg-enterprise-manager"
# Pin a specific RPM version (e.g. "1.2.3"). Leave empty to install whatever
# version the configured EDB repository provides.
wem_version: ""
# $wem_upgrade mirrors the install / upgrade vocabulary of
# $whpg_upgrade in the warehouse-pg role. Accepted values:
#   "install-but-no-automatic-upgrades" -> dnf state "present"
#   "always-upgrade-to-latest-minor"    -> dnf state "latest"
#   "absent"                            -> dnf state "absent" (remove RPM)
wem_upgrade: "install-but-no-automatic-upgrades"

# Filesystem locations created by the RPM
wem_install_dir: "/usr/local/greenplum-db/wem"
wem_config_dir: "/etc/wem"
wem_config_file: "/etc/wem/wem.conf"
wem_log_dir: "/var/log/wem"

# Unix user and group the RPM creates files for. Same variable names as the
# warehouse-pg role so a single inventory override affects both roles when
# WEM is co-located with WarehousePG on a coordinator or standby.
WHPG_UNIX_USER: "gpadmin"
WHPG_UNIX_GROUP: "gpadmin"

# Systemd service management
wem_service_name: "wem"
wem_service_enabled: true
wem_service_started: true

# -----------------------------------------------------------------------------
# Security: session cookie
# -----------------------------------------------------------------------------
# Leave empty to have the role auto-generate a 32 byte base64 secret
# the first time the role runs. Provide a value to manage it explicitly.
wem_cookie_secret: ""
# Set to "1" (or any non-empty value) when the dashboard is not served over HTTPS
wem_insecure_cookies: "1"

# -----------------------------------------------------------------------------
# Security: initial admin password
# -----------------------------------------------------------------------------
# Leave empty to have the role auto-generate a 24 byte base64 password
# the first time the role runs.
wem_admin_password: "admin"

# -----------------------------------------------------------------------------
# Database connection: monitored WarehousePG cluster (WHPG_*)
# -----------------------------------------------------------------------------
# Host and user have no defaults — the operator must provide them.
# The pre-flight task asserts both are set before any install runs.
whpg_host: "127.0.0.1"
whpg_port: 5432
whpg_user: "wem_user"

# Password for the WEM dashboard to connect to the WarehousePG cluster.
# Must be set by the operator — no built-in default.
# whpg_password: ""

# Existing database on the WarehousePG cluster to connect to. Leave commented
# to have the WEM dashboard connect to the default postgres database and
# create the wem database itself.
# whpg_database: "wem"

# Optional existing separate monitoring database (leave commented to reuse whpg_database)
# whpg_monitoring_db: "wem_monitoring"

# -----------------------------------------------------------------------------
# Database connection: WEM application state (WEM_*)
# -----------------------------------------------------------------------------
# WEM stores its application state in the separate PostgreSQL database defined
# by these variables. By default. `wem setup` creates the database and
# schema on first service start.
wem_state_db_host: "127.0.0.1"
wem_state_db_port: 5433
wem_state_db: "wem"
wem_state_db_user: "wem_admin"
# Use a password for the WEM state database user. Leave empty to use trust auth (pg_hba.conf must allow it and postgres is installed locally).
# wem_state_db_password:

# -----------------------------------------------------------------------------
# Web server
# -----------------------------------------------------------------------------
wem_port: 8080
# Callback base URL agents use to reach this WEM instance.
# Defaults to the Ansible connection address + wem_port.
# Override with an explicit FQDN or IP if ansible_host is not agent-reachable.
wem_agent_callback_base_url: "http://{{ ansible_host }}:{{ wem_port }}"

# -----------------------------------------------------------------------------
# Performance (optional)
# -----------------------------------------------------------------------------
# Set to "true" to enable high-load mode with extended timeouts
wem_high_load_mode: ""

# -----------------------------------------------------------------------------
# Observability (optional)
# -----------------------------------------------------------------------------
alertmanager_host: "localhost"
alertmanager_port: 9093
loki_host: "localhost"
loki_port: 3100
prometheus_host: "localhost"
prometheus_port: 9090

wem_alertmanager_url: "http://{{ alertmanager_host }}:{{ alertmanager_port }}"
wem_loki_url: "http://{{ loki_host }}:{{ loki_port }}"
wem_prometheus_url: "http://{{ prometheus_host }}:{{ prometheus_port }}"

# Log level for the exporter: debug, info, warn, error
wem_exporter_log_level: ""
# Interval/timeout for remote write operations (e.g. 15s, 1m, 5m)
wem_exporter_remote_write_interval: ""
wem_exporter_remote_write_timeout: ""
# When "true", WEM actively pushes warehousepg_observability_* metrics to
# Prometheus based on wem_exporter_remote_write_* settings above.
wem_exporter_remote_write_enabled: ""

# -----------------------------------------------------------------------------
# Remote write receiver (Grafana Alloy → WEM) (optional)
# -----------------------------------------------------------------------------
# Accept Prometheus remote write at POST /api/v1/write. Leave empty to keep
# the shipped commented examples in /etc/wem/wem.conf.
wem_remote_write_receiver_enabled: ""
wem_remote_write_receiver_port: ""
wem_remote_write_receiver_ttl: ""
# Bearer token required on POST /api/v1/write. Generate with
# `openssl rand -base64 32` and configure the same value in Grafana Alloy.
wem_remote_write_receiver_token: ""

# -----------------------------------------------------------------------------
# Query monitor UI
# -----------------------------------------------------------------------------
# Threshold (minutes) for the "Long Running" indicator. Default in WEM: 10.
wem_long_running_threshold: ""

# -----------------------------------------------------------------------------
# PXF integration (optional)
# -----------------------------------------------------------------------------
# These knobs are shipped commented in /etc/wem/wem.conf; set the matching
# variable to emit and uncomment the line. The RPM's `wem configure-pxf-sandbox`
# helper auto-detects most of these — only set them to force a specific value.
#
# OS user `pxf cluster` runs as. Upstream PXF requires WHPG and PXF to use
# the same OS account, so this also determines the WHPG admin user.
wem_whpg_os_user: ""
# Override the path to the pxf binary when it lives outside the auto-detected
# locations.
wem_whpg_pxf_bin: ""
# Force a specific PXF_BASE instead of auto-detecting from the target user's
# shell init files.
wem_whpg_pxf_base: ""
# Per-deployment timeout (seconds) for `pxf cluster start`/`stop`. Clamped to
# [30, 600] by the binary.
wem_whpg_pxf_op_timeout_seconds: ""
# Set to "true/false" to allow the wem service to start as root (containerized or
# legacy-migration deployments). Logged as WARNING on every restart.
wem_whpg_allow_root: ""

# -----------------------------------------------------------------------------
# Temporal connection
# -----------------------------------------------------------------------------
# Address of the Temporal frontend (host:port) WEM connects to.
# Defaults to localhost when Temporal is co-located on the same host.
temporal_address: "localhost:7233"
