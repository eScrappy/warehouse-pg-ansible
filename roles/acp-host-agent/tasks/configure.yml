---

- name: Discover coordinator data directory from running cluster
  ansible.builtin.shell:
    cmd: |
      source {{ greenplum_path }}
      psql -p {{ whpg_port }} -d postgres -tAc 'SHOW data_directory;'
    executable: /bin/bash
  become: "{{ ansible_facts['user_id'] != WHPG_UNIX_USER }}"
  become_user: "{{ WHPG_UNIX_USER }}"
  register: _whpg_coordinator_data_dir
  changed_when: false

# The acp-host-agent RPM ships /etc/edb/acp-host-agent/acp-host-agent.conf
# as the default EnvironmentFile. We edit it in place so that RPM-shipped
# comments and defaults remain visible to operators. Only TEMPORAL_ADDRESS
# is always written; auth settings are only uncommented when provided.

- name: Set TEMPORAL_ADDRESS in acp-host-agent.conf
  ansible.builtin.lineinfile:
    path: "{{ acp_agent_config_file }}"
    regexp: '^#?\s*TEMPORAL_ADDRESS='
    line: "TEMPORAL_ADDRESS={{ acp_agent_temporal_address }}"
    state: present
  become: true
  notify: Restart acp-host-agent

- name: Set optional Temporal auth and identity values when provided
  ansible.builtin.lineinfile:
    path: "{{ acp_agent_config_file }}"
    regexp: "^#?\\s*{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: "TEMPORAL_API_KEY",            value: "{{ acp_agent_temporal_api_key }}" }
    - { key: "TEMPORAL_TLS_CERT",           value: "{{ acp_agent_temporal_tls_cert }}" }
    - { key: "TEMPORAL_TLS_KEY",            value: "{{ acp_agent_temporal_tls_key }}" }
    - { key: "TEMPORAL_TLS_SERVER_CA_CERT", value: "{{ acp_agent_temporal_tls_server_ca_cert }}" }
    - { key: "TEMPORAL_TLS_SERVER_NAME",    value: "{{ acp_agent_temporal_tls_server_name }}" }
    - { key: "AGENT_ID",                    value: "{{ acp_agent_id }}" }
    - { key: "AGENT_STATE_DIR",             value: "{{ acp_agent_state_dir }}" }
    - { key: "GPHOME",                      value: "{{ acp_agent_gphome }}" }
    - { key: "WHPG_DATA_DIR",              value: "{{ _whpg_coordinator_data_dir.stdout | trim }}" }
  when: item.value | string | length > 0
  no_log: true
  become: true
  notify: Restart acp-host-agent

- name: Enable and start acp-host-agent service
  ansible.builtin.systemd:
    name: "{{ acp_agent_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  become_user: root
