---

- name: Replace ident with md5 for host connections in pg_hba.conf
  ansible.builtin.replace:
    path: "{{ pg_data_dir }}/pg_hba.conf"
    regexp: '^(host\s+\S+\s+\S+\s+\S+)\s+ident$'
    replace: '\1 md5'
  become: true
  become_user: postgres
  notify: Reload postgresql

# Replace in-place so the trust rule wins without relying on insertion order.
- name: Set trust auth for local IPv4 127.0.0.1/32 connections in pg_hba.conf
  ansible.builtin.replace:
    path: "{{ pg_data_dir }}/pg_hba.conf"
    regexp: '^(host\s+all\s+all\s+127\.0\.0\.1/32)\s+\S+'
    replace: '\1 trust'
  become: true
  become_user: root
  notify: Reload postgresql

# On hosts where `localhost` resolves to ::1, the IPv4 rule above is bypassed.
- name: Set trust auth for local IPv6 ::1/128 connections in pg_hba.conf
  ansible.builtin.replace:
    path: "{{ pg_data_dir }}/pg_hba.conf"
    regexp: '^(host\s+all\s+all\s+::1/128)\s+\S+'
    replace: '\1 trust'
  become: true
  become_user: root
  notify: Reload postgresql

