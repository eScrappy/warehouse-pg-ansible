---

# Prometheus version to download from GitHub releases
prometheus_version: "3.5.1"

# Unix user and group for Prometheus
prometheus_user: "prometheus"
prometheus_group: "prometheus"

# Filesystem paths
prometheus_install_dir: "/usr/local/bin"
prometheus_config_dir: "/etc/prometheus"
prometheus_data_dir: "/var/lib/prometheus"

# Web listener
prometheus_listen_address: "{{ ip_address }}"
prometheus_port: 9090

# Scrape interval
prometheus_scrape_interval: "15s"
prometheus_evaluation_interval: "15s"

# WEM metrics endpoint
prometheus_wem_port: 8080

# Alertmanager endpoint
prometheus_alertmanager_port: 9093
