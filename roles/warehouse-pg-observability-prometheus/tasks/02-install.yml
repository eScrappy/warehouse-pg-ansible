---

- name: Create prometheus group
  ansible.builtin.group:
    name: "{{ prometheus_group }}"
    system: true
    state: present

- name: Create prometheus user
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    system: true
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Create Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: "0755"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_data_dir }}"

- name: Check if Prometheus binary exists with correct version
  ansible.builtin.command:
    cmd: "{{ prometheus_install_dir }}/prometheus --version"
  register: _prometheus_installed_version
  changed_when: false
  failed_when: false

- name: Download and install Prometheus binary
  when: >
    _prometheus_installed_version.rc != 0 or
    prometheus_version not in _prometheus_installed_version.stdout
  block:
    - name: Create secure temp directory
      ansible.builtin.tempfile:
        state: directory
        suffix: "_prometheus"
      register: _prometheus_tmp_dir

    - name: Fetch Prometheus SHA256 checksums
      ansible.builtin.uri:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/sha256sums.txt"
        return_content: true
      register: _prometheus_checksums

    - name: Parse SHA256 checksum for Prometheus archive
      ansible.builtin.set_fact:
        _prometheus_checksum: >-
          {{ (_prometheus_checksums.content.splitlines()
              | select('search', 'prometheus-' ~ prometheus_version ~ '.linux-amd64.tar.gz')
              | first).split()[0] }}

    - name: Download Prometheus archive
      ansible.builtin.get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: "{{ _prometheus_tmp_dir.path }}/prometheus.tar.gz"
        checksum: "sha256:{{ _prometheus_checksum }}"
        mode: "0600"

    - name: Extract Prometheus archive
      ansible.builtin.unarchive:
        src: "{{ _prometheus_tmp_dir.path }}/prometheus.tar.gz"
        dest: "{{ _prometheus_tmp_dir.path }}"
        remote_src: true

    - name: Install Prometheus binaries
      ansible.builtin.copy:
        src: "{{ _prometheus_tmp_dir.path }}/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "{{ prometheus_install_dir }}/{{ item }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      loop:
        - prometheus
        - promtool
      notify: Restart prometheus

  always:
    - name: Remove secure temp directory
      ansible.builtin.file:
        path: "{{ _prometheus_tmp_dir.path }}"
        state: absent
      when: _prometheus_tmp_dir.path is defined
