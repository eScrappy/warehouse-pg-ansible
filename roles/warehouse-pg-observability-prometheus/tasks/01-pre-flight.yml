---

- name: Check for Red Hat based OS
  ansible.builtin.assert:
    that:
      - ansible_facts["os_family"] == "RedHat"
    fail_msg: "This role only supports Red Hat based operating systems."

- name: Check that role runs as root
  ansible.builtin.assert:
    that:
      - ansible_facts["user_uid"] == 0
    fail_msg: "This role requires become: true — tasks must run as root."
